<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <div id="custom-fields-display">
    <!-- Campos editables se renderizan aquí -->
  </div>

  <hr>

  <div id="checklists-progress">
    <div id="checklists-container">
      <!-- Barras de progreso y checklists aquí -->
    </div>
  </div>

  <script>
    var t = TrelloPowerUp.iframe();

    t.render(function() {
      return Promise.all([
        t.get('board', 'shared', 'fieldDefs'),
        t.get('card', 'shared', 'fieldValues'),
        t.card('checklists')
      ]).then(function(data) {
        var defs = data[0] || [];
        var values = data[1] || {};
        var card = data[2] || {};
        var checklists = card.checklists || [];

        renderFields(defs, values);
        renderChecklists(checklists);
      });
    });

    setInterval(function() {
      t.render();
    }, 3000);

    var renderFields = function(defs, values) {
      var container = document.getElementById('custom-fields-display');
      container.innerHTML = '';

      defs = defs.sort(function(a, b) {
        return a.order - b.order;
      });

      if (defs.length === 0) {
        container.innerHTML = '<p class="empty-message">Sin campos configurados.</p>';
        return;
      }

      var form = document.createElement('form');
      form.id = 'inline-fields-form';
      form.className = 'inline-fields-form';

      defs.forEach(function(f) {
        var row = document.createElement('div');
        row.className = 'inline-field-row';

        var label = document.createElement('label');
        label.htmlFor = 'inline-input-' + f.id;
        label.innerText = f.name + (f.required ? ' *' : '') + ':';

        var value = values[f.id] || '';
        var input;

        if (f.type === 'textarea') {
          input = document.createElement('textarea');
          input.value = value;
          input.rows = 2;
        } else if (f.type === 'list') {
          input = document.createElement('select');

          var emptyOpt = document.createElement('option');
          emptyOpt.value = '';
          emptyOpt.text = '— Seleccionar —';
          input.appendChild(emptyOpt);

          (f.options || []).forEach(function(opt) {
            var option = document.createElement('option');
            option.value = opt;
            option.text = opt;
            if (opt === value) option.selected = true;
            input.appendChild(option);
          });
        } else if (f.type === 'checkbox') {
          input = document.createElement('input');
          input.type = 'checkbox';
          input.checked = !!value;
        } else {
          input = document.createElement('input');
          input.type = f.type === 'number' ? 'number' : (f.type === 'date' ? 'date' : 'text');
          input.value = value;
        }

        input.id = 'inline-input-' + f.id;
        input.name = f.id;
        input.dataset.fieldType = f.type;

        row.appendChild(label);
        row.appendChild(input);
        form.appendChild(row);
      });

      var actions = document.createElement('div');
      actions.className = 'inline-field-actions';

      var saveButton = document.createElement('button');
      saveButton.type = 'submit';
      saveButton.className = 'primary';
      saveButton.innerText = 'Guardar campos';

      actions.appendChild(saveButton);
      form.appendChild(actions);

      form.onsubmit = function(e) {
        e.preventDefault();

        var newValues = {};
        var missing = [];

        defs.forEach(function(f) {
          var input = document.getElementById('inline-input-' + f.id);
          var val = f.type === 'checkbox' ? input.checked : input.value;

          if (f.required && f.type !== 'checkbox' && (!val || String(val).trim() === '')) {
            missing.push(f.name);
          }

          newValues[f.id] = val;
        });

        if (missing.length > 0) {
          alert('Los siguientes campos son requeridos: ' + missing.join(', '));
          return;
        }

        saveFieldValues(newValues).then(function() {
          t.alert({
            message: 'Campos guardados',
            duration: 2
          });
          return t.render();
        });
      };

      container.appendChild(form);
    };

    function saveFieldValues(newValues) {
      return t.card('id', 'name')
        .then(function(card) {
          return Promise.all([
            t.set('card', 'shared', 'fieldValues', newValues),
            t.get('board', 'shared', 'fieldIndex')
          ]).then(function(results) {
            var fieldIndex = results[1] || {};

            fieldIndex[card.id] = {
              cardId: card.id,
              cardName: card.name,
              values: newValues,
              updatedAt: new Date().toISOString()
            };

            return t.set('board', 'shared', 'fieldIndex', fieldIndex);
          });
        });
    }

    var renderChecklists = function(checklists) {
      var container = document.getElementById('checklists-container');
      container.innerHTML = '';

      var totalAll = 0;
      var doneAll = 0;

      (checklists || []).forEach(function(cl) {
        (cl.checkItems || []).forEach(function(item) {
          totalAll++;
          if (item.state === 'complete') {
            doneAll++;
          }
        });
      });

      var pctTotal = totalAll > 0 ? Math.round((doneAll / totalAll) * 100) : 0;

      var title = document.createElement('div');
      title.className = 'checklist-progress-title';
      title.innerHTML = '<strong>Checklist</strong>: ' + doneAll + '/' + totalAll + ' (' + pctTotal + '%)';
      container.appendChild(title);
      container.appendChild(createProgressBar(pctTotal));

      if (!checklists || checklists.length === 0) {
        return;
      }

      checklists.forEach(function(cl) {
        var total = 0;
        var done = 0;

        (cl.checkItems || []).forEach(function(item) {
          total++;
          if (item.state === 'complete') {
            done++;
          }
        });

        var pct = total > 0 ? Math.round((done / total) * 100) : 0;

        var checklistTitle = document.createElement('div');
        checklistTitle.className = 'checklist-progress-title';
        checklistTitle.innerHTML = '<strong>' + cl.name + '</strong>: ' + done + '/' + total + ' (' + pct + '%)';

        container.appendChild(checklistTitle);
        container.appendChild(createProgressBar(pct));
      });
    };

    function createProgressBar(pct) {
      var barContainer = document.createElement('div');
      barContainer.className = 'progress-bar-container';
      
      var barFill = document.createElement('div');
      barFill.className = 'progress-bar-fill';
      barFill.style.width = pct + '%';
      
      if (pct >= 100) barFill.classList.add('progress-green');
      else if (pct >= 50) barFill.classList.add('progress-orange');
      else barFill.classList.add('progress-red');
      
      barContainer.appendChild(barFill);
      return barContainer;
    }
  </script>
</body>
</html>
