<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <div id="custom-fields-display" class="cf-grid">
    <!-- Campos se renderizan aquí -->
  </div>

  <hr>

  <div id="checklists-progress">
    <label>Progreso de Checklists</label>
    <div id="checklists-container">
      <!-- Barras de progreso aquí -->
    </div>
  </div>

  <script>
    var t = TrelloPowerUp.iframe();

    t.render(function() {
      return Promise.all([
        t.get('board', 'shared', 'fieldDefs'),
        t.get('card', 'shared', 'fieldValues'),
        t.card('checklists')
      ]).then(function(data) {
        var defs = data[0] || [];
        var values = data[1] || {};
        var checklists = data[2].checklists || [];

        renderFields(defs, values);
        renderChecklists(checklists);
      });
    });

    var renderFields = function(defs, values) {
      var container = document.getElementById('custom-fields-display');
      container.innerHTML = '';
      
      var hasVisibleFields = false;
      defs.sort((a,b) => a.order - b.order).forEach(f => {
        var val = values[f.id];
        if (val === undefined || val === null || val === '' || val === false) return;
        
        hasVisibleFields = true;
        var cell = document.createElement('div');
        cell.className = 'cf-cell' + (f.width === 'full' ? ' cf-cell-full' : '');
        
        var label = document.createElement('label');
        label.innerText = f.name;
        cell.appendChild(label);
        
        var content = document.createElement('div');
        content.style.padding = '4px 0';
        
        if (f.type === 'checkbox') {
          content.innerText = '✅';
        } else if (f.type === 'textarea') {
          content.style.whiteSpace = 'pre-wrap';
          content.innerText = val;
        } else {
          content.innerText = val;
        }
        
        cell.appendChild(content);
        container.appendChild(cell);
      });

      if (!hasVisibleFields) {
        container.innerHTML = '<p style="color:var(--text-hint); font-size:12px;">Sin campos configurados o con valores.</p>';
      }
    };

    var renderChecklists = function(checklists) {
      var container = document.getElementById('checklists-container');
      container.innerHTML = '';
      
      if (checklists.length === 0) {
        container.innerHTML = '<p style="color:var(--text-hint); font-size:12px;">No hay checklists en esta tarjeta.</p>';
        return;
      }

      var totalAll = 0, doneAll = 0;

      checklists.forEach(cl => {
        var total = 0, done = 0;
        (cl.checkItems || []).forEach(item => {
          total++;
          totalAll++;
          if (item.state === 'complete') {
            done++;
            doneAll++;
          }
        });

        var pct = total > 0 ? Math.round((done / total) * 100) : 0;
        
        var title = document.createElement('div');
        title.style.fontSize = '12px';
        title.style.marginTop = '8px';
        title.innerHTML = `<strong>${cl.name}</strong>: ${done}/${total} (${pct}%)`;
        container.appendChild(title);

        container.appendChild(createProgressBar(pct));
      });

      // Total general si hay más de una checklist
      if (checklists.length > 1) {
        var pctTotal = totalAll > 0 ? Math.round((doneAll / totalAll) * 100) : 0;
        var title = document.createElement('div');
        title.style.fontSize = '13px';
        title.style.marginTop = '15px';
        title.style.borderTop = '1px solid var(--border)';
        title.style.paddingTop = '8px';
        title.innerHTML = `<strong>Progreso Total</strong>: ${doneAll}/${totalAll} (${pctTotal}%)`;
        container.appendChild(title);
        container.appendChild(createProgressBar(pctTotal));
      }
    };

    function createProgressBar(pct) {
      var barContainer = document.createElement('div');
      barContainer.className = 'progress-bar-container';
      
      var barFill = document.createElement('div');
      barFill.className = 'progress-bar-fill';
      barFill.style.width = pct + '%';
      
      if (pct >= 100) barFill.classList.add('progress-green');
      else if (pct >= 50) barFill.classList.add('progress-orange');
      else barFill.classList.add('progress-red');
      
      barContainer.appendChild(barFill);
      return barContainer;
    }
  </script>
</body>
</html>
