<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <form id="fields-form">
    <div id="fields-container" class="cf-grid">
      <!-- Los campos se renderizan aquí -->
    </div>

    <div id="special-fields-container" class="cf-grid" style="display:none; margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px;">
      <div class="cf-cell">
        <label>Prefijo</label>
        <select id="prefix-select"></select>
      </div>
      <div class="cf-cell">
        <label>Título Corto (máx 15 palabras)</label>
        <input type="text" id="short-title-input" placeholder="Escribe el título corto...">
        <p id="word-count-hint" style="font-size: 10px; color: var(--text-hint); margin-top: -5px;"></p>
      </div>
    </div>
    
    <div id="title-preview-section" style="display:none; margin-top: 15px; padding: 10px; background: var(--bg-form); border-radius: 4px;">
      <label>Vista previa del Título</label>
      <div id="title-preview" style="font-weight: bold; margin-bottom: 8px; word-break: break-all;"></div>
      <button type="button" id="apply-title" class="secondary">Aplicar Título a la Tarjeta</button>
      <p id="auth-hint" style="font-size: 10px; color: var(--text-hint); margin-top: 5px; display: none;">Se requerirá autorización la primera vez.</p>
    </div>

    <div style="margin-top: 20px;">
      <button type="submit" class="primary">Guardar Cambios</button>
    </div>
  </form>

  <script>
    var t = TrelloPowerUp.iframe();
    var fieldDefs = [];
    var fieldValues = {};
    var titleSettings = { enabled: false, pattern: '' };
    var specialSettings = { enabled: false, prefixes: '', pattern: '' };
    var originalCardName = '';

    t.render(function() {
      return Promise.all([
        t.get('board', 'shared', 'fieldDefs'),
        t.get('card', 'shared', 'fieldValues'),
        t.get('board', 'shared', 'titlePattern'),
        t.get('board', 'shared', 'specialTitlePattern'),
        t.card('name')
      ]).then(function(data) {
        fieldDefs = data[0] || [];
        fieldValues = data[1] || {};
        titleSettings = data[2] || { enabled: false, pattern: '' };
        specialSettings = data[3] || { enabled: false, prefixes: '', pattern: '' };
        originalCardName = data[4].name;

        renderForm();
        updateTitlePreview();
      });
    });

    var renderForm = function() {
      var container = document.getElementById('fields-container');
      container.innerHTML = '';
      
      fieldDefs.sort((a,b) => a.order - b.order).forEach(f => {
        var cell = document.createElement('div');
        cell.className = 'cf-cell cf-cell-full';
        
        var label = document.createElement('label');
        label.innerText = f.name + (f.required ? ' *' : '');
        cell.appendChild(label);
        
        var value = fieldValues[f.id] || '';
        var input;
        
        if (f.type === 'textarea') {
          input = document.createElement('textarea');
          input.value = value;
          input.rows = 3;
        } else if (f.type === 'list') {
          input = document.createElement('select');
          var emptyOpt = document.createElement('option');
          emptyOpt.value = '';
          emptyOpt.text = '— Seleccionar —';
          input.appendChild(emptyOpt);
          (f.options || []).forEach(opt => {
            var o = document.createElement('option');
            o.value = opt;
            o.text = opt;
            if (opt === value) o.selected = true;
            input.appendChild(o);
          });
        } else if (f.type === 'checkbox') {
          input = document.createElement('input');
          input.type = 'checkbox';
          input.checked = !!value;
          input.style.width = 'auto';
        } else {
          input = document.createElement('input');
          input.type = f.type === 'number' ? 'number' : (f.type === 'date' ? 'date' : 'text');
          input.value = value;
        }
        
        input.name = f.id;
        input.id = 'input-' + f.id;
        input.onchange = updateTitlePreview;
        input.oninput = updateTitlePreview;
        cell.appendChild(input);
        container.appendChild(cell);
      });

      if (specialSettings.enabled) {
        var specialValues = fieldValues['_special_'] || { prefix: '', shortTitle: '' };
        var specialContainer = document.getElementById('special-fields-container');
        specialContainer.style.display = 'grid';
        
        var prefixSelect = document.getElementById('prefix-select');
        prefixSelect.innerHTML = '';
        var prefixes = specialSettings.prefixes.split(',').map(s => s.trim()).filter(s => s);
        prefixes.forEach(p => {
          var opt = document.createElement('option');
          opt.value = p;
          opt.text = p;
          if (p === specialValues.prefix) opt.selected = true;
          prefixSelect.appendChild(opt);
        });
        prefixSelect.onchange = updateTitlePreview;

        var shortTitleInput = document.getElementById('short-title-input');
        shortTitleInput.value = specialValues.shortTitle || '';
        shortTitleInput.oninput = function() {
          var words = this.value.trim().split(/\s+/).filter(w => w.length > 0);
          var count = words.length;
          document.getElementById('word-count-hint').innerText = count + ' / 15 palabras';
          document.getElementById('word-count-hint').style.color = count > 15 ? 'var(--red-error)' : 'var(--text-hint)';
          updateTitlePreview();
        };
        // Trigger initial count
        shortTitleInput.oninput();
      }

      if ((titleSettings.enabled && titleSettings.pattern) || (specialSettings.enabled && specialSettings.pattern)) {
        document.getElementById('title-preview-section').style.display = 'block';
      }
    };

    var updateTitlePreview = function() {
      var newTitle = '';
      
      if (specialSettings.enabled && specialSettings.pattern) {
        newTitle = specialSettings.pattern;
        var prefix = document.getElementById('prefix-select').value;
        var shortTitle = document.getElementById('short-title-input').value;
        
        newTitle = newTitle.replace(/\{Prefix\}/gi, prefix || '…');
        newTitle = newTitle.replace(/\{ShortTitle\}/gi, shortTitle || '…');
      } else if (titleSettings.enabled && titleSettings.pattern) {
        newTitle = titleSettings.pattern;
      } else {
        return;
      }
      
      fieldDefs.forEach(f => {
        var input = document.getElementById('input-' + f.id);
        var val = '';
        if (input) {
          val = (f.type === 'checkbox') ? (input.checked ? 'Sí' : 'No') : input.value;
        }
        
        var re = new RegExp('\\{' + escapeRegex(f.name) + '\\}', 'gi');
        newTitle = newTitle.replace(re, val || '…');
      });
      
      var reTitle = new RegExp('\\{Título\\}', 'gi');
      newTitle = newTitle.replace(reTitle, originalCardName);
      
      document.getElementById('title-preview').innerText = newTitle;
    };

    function escapeRegex(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    document.getElementById('fields-form').onsubmit = function(e) {
      e.preventDefault();
      
      var newValues = {};
      var missing = [];
      
      fieldDefs.forEach(f => {
        var input = document.getElementById('input-' + f.id);
        var val = (f.type === 'checkbox') ? input.checked : input.value;
        
        if (f.required && f.type !== 'checkbox' && (!val || String(val).trim() === '')) {
          missing.push(f.name);
        }
        newValues[f.id] = val;
      });

      if (specialSettings.enabled) {
        newValues['_special_'] = {
          prefix: document.getElementById('prefix-select').value,
          shortTitle: document.getElementById('short-title-input').value
        };
      }
      
      if (missing.length > 0) {
        alert('Los siguientes campos son requeridos: ' + missing.join(', '));
        return;
      }
      
      saveFieldValues(newValues).then(function() {
        t.closePopup();
      });
    };

    function saveFieldValues(newValues) {
      return t.card('id', 'name')
        .then(function(card) {
          return Promise.all([
            t.set('card', 'shared', 'fieldValues', newValues),
            t.get('board', 'shared', 'fieldIndex')
          ]).then(function(results) {
            var fieldIndex = results[1] || {};

            fieldIndex[card.id] = {
              cardId: card.id,
              cardName: card.name,
              values: newValues,
              updatedAt: new Date().toISOString()
            };

            return t.set('board', 'shared', 'fieldIndex', fieldIndex);
          });
        });
    }

    document.getElementById('apply-title').onclick = function() {
      if (specialSettings.enabled) {
        var shortTitle = document.getElementById('short-title-input').value;
        var words = shortTitle.trim().split(/\s+/).filter(w => w.length > 0);
        if (words.length > 15) {
          alert('El Título Corto no puede superar las 15 palabras.');
          return;
        }
      }

      var newTitle = document.getElementById('title-preview').innerText;
      var restApi = t.getRestApi();
      
      restApi.isAuthorized().then(function(isAuth) {
        if (!isAuth) {
          document.getElementById('auth-hint').style.display = 'block';
          return restApi.authorize({ scope: 'read,write' });
        }
      }).then(function() {
        return t.card('id');
      }).then(function(card) {
        return restApi.put('/1/cards/' + card.id, { name: newTitle });
      }).then(function() {
        originalCardName = newTitle;
        t.alert({ message: 'Título actualizado con éxito', duration: 3 });
      }).catch(function(err) {
        console.error(err);
      });
    };
  </script>
</body>
</html>
